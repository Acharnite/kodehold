name: KodeHold CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  smoke:
    name: Smoke Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run smoke tests
        run: |
          for t in tests/smoke/*.sh; do
            echo "--- Running $t ---"
            bash "$t"
            echo ""
          done

  init:
    name: Init Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # ICM removed after ADR-0029 agentmemory migration (ADR-0029).
      # The old ICM setup + bootstrap was only needed for 02-icm-check.sh,
      # which now warns (not fails) when no agentmemory daemon is present.
      # If agentmemory daemon is ever run in CI, add an `npm install` +
      # `agentmemory start` step here instead.
      - name: Run init tests
        run: |
          for t in tests/init/*.sh; do
            echo "--- Running $t ---"
            bash "$t"
            echo ""
          done

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run integration tests
        run: |
          for t in tests/integration/*.sh; do
            echo "--- Running $t ---"
            bash "$t"
            echo ""
          done
