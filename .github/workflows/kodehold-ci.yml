name: KodeHold CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Python deps
        run: pip install pyyaml jsonschema
      - name: Run tests
        run: python3 -m pytest tests/ -v

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate YAML files
        run: |
          pip install yamllint 2>/dev/null
          yamllint -d "{extends: relaxed, rules: {line-length: disable}}" .github/ config/ || true
      - name: Python lint
        run: |
          pip install ruff 2>/dev/null
          ruff check scripts/ tests/

  validate-config:
    name: Validate Config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run config validation
        run: python3 scripts/validate_config.py
