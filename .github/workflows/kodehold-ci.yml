name: KodeHold CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  smoke:
    name: Smoke Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run smoke tests
        run: |
          for t in tests/smoke/*.sh; do
            echo "--- Running $t ---"
            bash "$t"
            echo ""
          done

  init:
    name: Init Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # Agentmemory daemon removed per ADR-0050.
      # The old agentmemory setup was only needed for 02-icm-check.sh,
      # which has been updated to not require a running daemon.
      # Pre-task knowledge retrieval is now handled by OpenCode's built-in
      # RAG tools (search_semantic, find_usages, get_file_skeleton, describe_image).
      - name: Run init tests
        run: |
          for t in tests/init/*.sh; do
            echo "--- Running $t ---"
            bash "$t"
            echo ""
          done

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run integration tests
        run: |
          for t in tests/integration/*.sh; do
            echo "--- Running $t ---"
            bash "$t"
            echo ""
          done
