name: KodeHold CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  smoke:
    name: Smoke Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run smoke tests
        run: |
          for t in tests/smoke/*.sh; do
            echo "--- Running $t ---"
            bash "$t"
            echo ""
          done

  init:
    name: Init Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Setup ICM
        run: |
          ICM_VERSION="icm-v0.10.50"
          curl -fsSL \
            "https://github.com/rtk-ai/icm/releases/download/$ICM_VERSION/icm-x86_64-unknown-linux-gnu.tar.gz" \
            | tar xz -C /tmp
          sudo mv /tmp/icm /usr/local/bin/
      - name: Bootstrap ICM database
        run: |
          mkdir -p .icm
          icm store --db .icm/memories.db \
            -t kodehold-ci-bootstrap \
            -i low \
            -k "ci,bootstrap" \
            -c "CI bootstrap memory — KodeHold test suite $(date -u '+%Y-%m-%d')"
      - name: Run init tests
        run: |
          for t in tests/init/*.sh; do
            echo "--- Running $t ---"
            bash "$t"
            echo ""
          done

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run integration tests
        run: |
          for t in tests/integration/*.sh; do
            echo "--- Running $t ---"
            bash "$t"
            echo ""
          done
