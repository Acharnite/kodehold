# config/gate.yaml — Declarative gate definitions for KodeHold lifecycle transitions
# Version: 1.0
#
# Compatible with loop-gate. Runs alongside gate.py (dual validation, assert parity).
# gate.py is authoritative until Phase 3.3 (ADR-0058).

version: "1.0"

# ── Check type reference ────────────────────────────────────────────────────
# file_exists:  { path }                         — Assert file exists
# dir_exists:   { path }                         — Assert directory exists
# grep:         { path, pattern }                — Assert pattern found in file
# file_count:   { path, pattern, min }           — Assert minimum file count matching pattern
# sections:     { path, required }               — Assert required sections exist in doc
# command:      { run }                          — Run shell command, assert exit 0
# git_log_recent: { pattern, warn_only }         — Check recent git log for pattern
# marker:       { path }                         — Assert marker file exists (semantic)
#
# All checks support warn_only: true to warn instead of fail.
# markers_required: checked for existence at transition level.
# markers_cleanup:  removed on gate pass.

transitions:
  INIT_TO_ACTIVE:
    description: >
      Design doc complete with all required sections, ADRs written,
      design reviewed and cross-model validated.
    markers_required:
      - .design_reviewed
      - .second_opinion_done
    markers_cleanup:
      - .design_reviewed
      - .second_opinion_done
    checks:
      design_doc_exists:
        type: file_exists
        path: "docs/design/README.md"
      design_doc_active:
        type: grep
        path: "docs/design/README.md"
        pattern: "Status.*Active"
        warn_only: true
      design_sections:
        type: sections
        path: "docs/design/README.md"
        required:
          - "Purpose & Scope"
          - "Requirements"
          - "Architecture Overview"
          - "Component Design"
          - "Data Model"
          - "API Design"
          - "Testing Strategy"
          - "ADR Index"
          - "Open Questions"
          - "Changelog"
      implementation_plan:
        type: sections
        path: "docs/design/README.md"
        required:
          - "Implementation Plan"
        optional_for_adopted: true
      adr_dir_exists:
        type: dir_exists
        path: "docs/adr"
      adr_count_min:
        type: file_count
        path: "docs/adr"
        pattern: "ADR-*.md"
        min: 1
      adr_index_exists:
        type: file_exists
        path: "docs/adr/README.md"
    interactive: true

  ACTIVE_TO_REVIEW:
    description: >
      Features implemented per design doc, tests passing,
      code reviewed by Reviewers.
    markers_required:
      - .testers_done
      - .code_reviewed
    markers_cleanup:
      - .testers_done
      - .code_reviewed
    checks:
      todo_exists:
        type: file_exists
        path: "TODO.md"
        warn_only: true
      tests_pass:
        type: command
        run: "python3 scripts/gate.py --tests-only"
      review_commits:
        type: git_log_recent
        pattern: "review|reviewed|approve"
        warn_only: true
    interactive: false

  REVIEW_TO_CLOSED:
    description: >
      Final sign-off: tests green, design doc preserved,
      all lifecycle markers cleaned up.
    markers_required: []
    markers_cleanup:
      - .design_reviewed
      - .testers_done
      - .impact_analysis_done
      - .code_reviewed
      - .second_opinion_done
      - .team_meeting_done
    checks:
      tests_pass:
        type: command
        run: "python3 scripts/gate.py --tests-only"
      design_doc_exists:
        type: file_exists
        path: "docs/design/README.md"
      git_clean:
        type: command
        run: "git diff --quiet"
        warn_only: true
    interactive: true

  CLOSED_TO_REOPEN:
    description: >
      Impact analysis completed by Architects, design doc updated
      with timestamp and new decisions documented.
    markers_required:
      - .impact_analysis_done
    markers_cleanup:
      - .impact_analysis_done
    checks:
      design_doc_exists:
        type: file_exists
        path: "docs/design/README.md"
      design_doc_timestamp:
        type: grep
        path: "docs/design/README.md"
        pattern: "Last Updated:"
        warn_only: true
      impact_notes:
        type: file_count
        path: "docs/decisions"
        pattern: "*.md"
        min: 1
        warn_only: true
    interactive: true

  REOPEN_TO_ACTIVE:
    description: >
      Design doc approved with Active status, ADR directory present,
      cross-model validation completed.
    markers_required:
      - .second_opinion_done
    markers_cleanup:
      - .second_opinion_done
    checks:
      design_doc_exists:
        type: file_exists
        path: "docs/design/README.md"
      design_doc_active:
        type: grep
        path: "docs/design/README.md"
        pattern: "Status.*Active"
        warn_only: true
      adr_dir_exists:
        type: dir_exists
        path: "docs/adr"
    interactive: false
