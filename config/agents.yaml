# agents.yaml — KodeHold Agent Configuration
# Schema: config/agents.schema.json
# Version: 1.0
#
# === CENTRAL TRIGGER REGISTRY ===
# Each trigger keyword belongs to exactly one agent (ADR-0037 §6.1).
# architects:      design, architecture, technology choice
# engineers:       implement, code, feature, bugfix, refactor, build
# reviewers:       review, code review, design review, standards
# testers:         test, verify, regression, coverage, QA, quality
# scribes:         memory, opencode-rag, context, save, recall, document, changelog, summary, design doc, ADR
# fls:             support, hotfix, triage, escalate, minor-change
# second-opinion:  second opinion, cross-model review, independent validation
# === END REGISTRY ===

defaults:
  mode: subagent
  permission:
    read: allow
    write: allow
    edit: allow
    glob: allow
    grep: allow
    bash: allow
    task: deny
    skill: allow
    webfetch: deny
    websearch: deny
    external_directory:
      "*": ask
      "/home/kiffer/project/**": allow
      "/tmp/**": allow
      "/home/kiffer/docker/**": allow

agents:
  - name: director
    description: >
      Top-level orchestrator for KodeHold projects. Manages full project lifecycle,
      assigns work to specialist teams via the Task tool, enforces quality gates,
      manages token budgets, and ensures the design document is single source of truth.
    mode: all
    tags:
      - orchestrator
      - lifecycle
    permission:
      write: deny
      edit: deny
      task: allow
      webfetch: allow
      websearch: allow

  - name: architects
    description: >
      Design authority for KodeHold projects. Author and maintain design documents,
      write Architecture Decision Records (ADRs), evaluate technology choices,
      review all design changes before implementation.
    tags:
      - design
      - architecture
    triggers:
      - design
      - architecture
      - technology choice
    permission:
      webfetch: allow
      websearch: allow

  - name: engineers
    description: >
      Implementation team. Generate code from design document specifications,
      refactor existing code, fix bugs. Always work with reference to specific
      design document section. Do not review own code.
    tags:
      - implementation
    triggers:
      - implement
      - code
      - feature
      - bugfix
      - refactor
      - build

  - name: reviewers
    description: >
      Quality assurance through review. Code review against design doc and standards.
      Design review and feedback. Verify ADR compliance. Coordinate second opinion
      requests with Director. Do not write implementation code.
    tags:
      - quality
      - review
    triggers:
      - review
      - code review
      - design review
      - standards

  - name: testers
    description: >
      Verification team. Write and execute unit, integration, and e2e tests.
      Run regression suites. Performance testing. Edge case analysis.
      Report coverage gaps to Engineers. Independent from implementation.
    tags:
      - testing
      - verification
    triggers:
      - test
      - verify
      - regression
      - coverage
      - QA
      - quality

  - name: scribes
    description: >
      Memory and ALL documentation team. Handle ALL documentation:
      design doc maintenance, ADR status management, CHANGES.md, TODO.md, VERSION.md.
      Free ALL other teams from documentation work.
    tags:
      - documentation
      - memory
    triggers:
      - memory
      - opencode-rag
      - context
      - save
      - recall
      - document
      - changelog
      - summary
      - design doc
      - ADR

  - name: fls
    description: >
      Front Line Support team. First line of defense for minor bugs and small
      changes in CLOSED/ACTIVE projects. Triages issues, applies hotfixes
      directly, and escalates comprehensive issues to REOPEN.
    tags:
      - support
      - hotfix
    triggers:
      - support
      - hotfix
      - triage
      - escalate
      - minor-change

  - name: second-opinion
    description: >
      Cross-provider second opinion. Reviews critical decisions using a
      different model/provider than the primary. Invoked by Director for
      ADRs, security-critical code, ambiguous designs.
    hidden: true
    model: openrouter/google/gemma-3-12b-it
    tags:
      - validation
      - review
    triggers:
      - second opinion
      - cross-model review
      - independent validation
    permission:
      write: deny
      edit: deny
      bash: deny
