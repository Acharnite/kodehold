<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADR Viewer — KodeHold</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  :root {
    --bg: #ffffff;
    --bg-code: #f6f8fa;
    --text: #1f2328;
    --text-muted: #656d76;
    --border: #d0d7de;
    --link: #0969da;
    --h1-border: #d0d7de;
    --blockquote-bg: #f6f8fa;
    --blockquote-border: #0969da;
    --table-border: #d0d7de;
    --table-bg-alt: #f6f8fa;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117;
      --bg-code: #151b23;
      --text: #e6edf3;
      --text-muted: #8b949e;
      --border: #30363d;
      --link: #58a6ff;
      --h1-border: #21262d;
      --blockquote-bg: #161b22;
      --blockquote-border: #30363d;
      --table-border: #30363d;
      --table-bg-alt: #161b22;
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
    font-size: 16px; line-height: 1.6; color: var(--text); background: var(--bg);
    padding: 32px; max-width: 960px; margin: 0 auto;
  }
  #loading, #error {
    text-align: center; padding: 40px; color: var(--text-muted); font-size: 14px;
  }
  #error { color: #cf222e; }
  #back-link {
    display: inline-block; margin-bottom: 16px; font-size: 13px; color: var(--link);
    text-decoration: none; padding: 4px 12px; border: 1px solid var(--border);
    border-radius: 6px; transition: 0.15s;
  }
  #back-link:hover { background: var(--bg-code); }

  /* GitHub-style markdown body */
  #content { word-wrap: break-word; }
  #content h1, #content h2 { border-bottom: 1px solid var(--h1-border); padding-bottom: 8px; margin-top: 24px; margin-bottom: 16px; font-weight: 600; }
  #content h1 { font-size: 2em; }
  #content h2 { font-size: 1.5em; }
  #content h3 { font-size: 1.25em; margin-top: 24px; margin-bottom: 16px; font-weight: 600; }
  #content h4 { font-size: 1em; margin-top: 24px; margin-bottom: 16px; font-weight: 600; }
  #content p { margin-bottom: 16px; }
  #content a { color: var(--link); text-decoration: none; }
  #content a:hover { text-decoration: underline; }
  #content code {
    padding: 2px 6px; font-size: 85%; font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    background: var(--bg-code); border-radius: 4px;
  }
  #content pre {
    padding: 16px; overflow: auto; font-size: 85%; line-height: 1.45;
    background: var(--bg-code); border-radius: 6px; margin-bottom: 16px;
  }
  #content pre code { padding: 0; background: none; }
  #content blockquote {
    padding: 0 1em; color: var(--text-muted); border-left: 4px solid var(--blockquote-border);
    background: var(--blockquote-bg); margin-bottom: 16px; padding: 12px 16px; border-radius: 4px;
  }
  #content table { border-collapse: collapse; width: 100%; margin-bottom: 16px; }
  #content th, #content td {
    padding: 8px 12px; border: 1px solid var(--table-border); text-align: left;
  }
  #content th { font-weight: 600; background: var(--bg-code); }
  #content tr:nth-child(even) { background: var(--table-bg-alt); }
  #content ul, #content ol { padding-left: 2em; margin-bottom: 16px; }
  #content li { margin-bottom: 4px; }
  #content hr { border: none; border-top: 1px solid var(--border); margin: 24px 0; }
  #content img { max-width: 100%; }
  #content .phase-block { background: var(--bg-code); border-radius: 6px; padding: 12px 16px; margin-bottom: 16px; border: 1px solid var(--border); font-size: 14px; }
  #content .phase-block .phase-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
</style>
</head>
<body>
<div id="loading">Loading ADR...</div>
<div id="error" style="display:none;"></div>
<div id="content"></div>

<script>
  var params = new URLSearchParams(window.location.search);
  var file = params.get('file');
  if (!file) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('error').style.display = 'block';
    document.getElementById('error').textContent = 'No file parameter specified. Use ?file=/adr/ADR-XXXX.md';
  } else {
    fetch(file)
      .then(function(r) {
        if (!r.ok) throw new Error('HTTP ' + r.status + ' — ' + file);
        return r.text();
      })
      .then(function(md) {
        document.getElementById('loading').style.display = 'none';
        var html = marked.parse(md);
        // Fix internal anchor links (ADR references like ADR-00XX)
        html = html.replace(/ADR-(\d{4}[a-z]?)/g, '<a href="/adr-viewer.html?file=/adr/ADR-$1.md">ADR-$1</a>');
        // Fix phase frontmatter if present
        html = html.replace(/^---[\s\S]*?---\n/, '');
        document.getElementById('content').innerHTML = html;
        document.title = document.querySelector('#content h1') ? document.querySelector('#content h1').textContent : 'ADR Viewer';
      })
      .catch(function(err) {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('error').style.display = 'block';
        document.getElementById('error').textContent = 'Error: ' + err.message;
      });
  }
</script>
</body>
</html>
