# Loop Engineering Pattern Registry
# Machine-readable index of all loop patterns used in KodeHold.

version: "1.0"
patterns:
  daily-triage:
    description: "Daily triage of stale PRs, failing CI, uncommitted ADRs"
    cadence: "weekdays 08:00"
    autonomy: "L1"
    skill: ".opencode/skills/loop-triage"
    budget: "loop-budget.md"
    constraints: "loop-constraints.md"
    wrapper: "scripts/loop-run.sh"
  pr-babysitter:
    description: "Monitor open PRs for staleness, merge conflicts, pending reviews"
    cadence: "weekdays 8/12/16"
    autonomy: "L1"
    skill: ".opencode/skills/loop-triage"
    budget: "loop-budget.md"
    constraints: "loop-constraints.md"
    wrapper: "scripts/loop-run.sh"
  drift-detection:
    description: "Weekly drift detection — ADR index vs files, state vs markers, TODO vs ADRs"
    cadence: "sunday 10:00"
    autonomy: "L1"
    skill: ".opencode/skills/loop-triage"
    budget: "loop-budget.md"
    constraints: "loop-constraints.md"
    wrapper: "scripts/loop-run.sh"
